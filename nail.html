<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Turnos - Demo Web</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #2563eb;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Reservá tu Turno</h2>
        <input type="text" id="nombre" placeholder="Tu Nombre">
        <input type="text" id="servicio" placeholder="Servicio (ej: Uñas, Pestañas)">
        <input type="text" id="hora" placeholder="Hora (ej: 16:30)">
        <button onclick="enviarTurnoWeb()">Confirmar Reserva Web</button>
    </div>

    <script>
        async function enviarTurnoWeb() {
            const nombre = document.getElementById('nombre').value.trim();
            const servicio = document.getElementById('servicio').value.trim();
            const hora = document.getElementById('hora').value.trim();

            if (!nombre || !servicio || !hora) {
                alert("Por favor completá todos los campos.");
                return;
            }

            const payload = {
                cliente_nombre: nombre,
                servicio: servicio,
                hora: hora,
                origen: "Página Web 🌐"
            };

            try {
                const res = await fetch("http://127.0.0.1:8000/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert("¡Turno registrado con éxito! Abrí el programa en Python y tocá 'Actualizar Lista'.");
                    document.getElementById('nombre').value = '';
                    document.getElementById('servicio').value = '';
                    document.getElementById('hora').value = '';
                } else {
                    alert("Error en el servidor al procesar la reserva.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("No se pudo conectar con el programa Python. Verificá que 'programa.py' esté ejecutándose.");
            }
        }
    </script>

</body>
</html>
